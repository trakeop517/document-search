services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_DB: documents_test
      POSTGRES_USER: search_test
      POSTGRES_PASSWORD: local_test_password
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  tests:
    build:
      context: .
      target: tests
    environment:
      POSTGRES_DB: documents_test
      POSTGRES_USER: search_test
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_INDEX: documents_test
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy